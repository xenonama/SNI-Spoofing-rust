[package]
name = "sni-gui"
version = "2.0.0"
edition = "2021"
description = "Unified single-executable: eframe GUI + in-process Tokio relay and WinDivert DPI dispatch (no child process)."

[[bin]]
name = "sni-gui"
path = "src/main.rs"

[dependencies]
sni-core = { path = "../core" }
sni-windivert = { path = "../windivert" }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }
