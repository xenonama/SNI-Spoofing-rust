[package]
name = "sni-gui"
version = "2.0.0"
edition = "2021"
description = "Desktop dashboard (port of gui.py Tkinter -> eframe/egui). Live channels arrive Phase 4."

[[bin]]
name = "sni-gui"
path = "src/main.rs"

[dependencies]
sni-core = { path = "../core" }
tokio = { workspace = true }
serde_json = { workspace = true }
