[package]
name = "sni-windivert"
version = "2.0.0"
edition = "2021"
description = "Safe WinDivert wrapper (port of injecter.py TcpInjector). Raw FFI arrives Phase 1."

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
byteorder = { workspace = true }

# Raw WinDivert syscalls via windows-rs (Windows only).
# Dynamic LoadLibrary (no link-time WinDivert.lib needed) — compiles
# anywhere, fails gracefully at runtime with actionable hints.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
