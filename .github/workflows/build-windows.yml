name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        working-directory: gui
        run: npm install

      - name: Generate default icon (no source needed)
        working-directory: gui
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1024, 1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.TextRenderingHint = 'AntiAliasGridFit'
          $g.Clear([System.Drawing.Color]::FromArgb(0, 180, 216))
          $font = New-Object System.Drawing.Font('Segoe UI', 400, [System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes]::White
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = 'Center'
          $fmt.LineAlignment = 'Center'
          $rect = New-Object System.Drawing.RectangleF 0, 0, 1024, 1024
          $g.DrawString('SNI', $font, $brush, $rect, $fmt)
          $g.Dispose()
          $bmp.Save("$pwd\default-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

      - name: Build icons into gui/icons/
        working-directory: gui
        run: npx tauri icon default-icon.png -o icons

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build

      - name: Find and stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null

          $exe = Get-ChildItem -Path "gui" -Filter "sni-gui.exe" -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*release*" } |
                 Select-Object -First 1
          if ($exe) {
            Write-Host "Found exe: $($exe.FullName)"
            Copy-Item $exe.FullName -Destination "artifacts/sni-gui.exe"
          } else {
            Write-Host "ERROR: sni-gui.exe not found anywhere under gui/"
            exit 1
          }

          $nsis = Get-ChildItem -Path "gui" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -like "*bundle*nsis*" } |
                  Select-Object -First 1
          if ($nsis) {
            Write-Host "Found NSIS installer: $($nsis.FullName)"
            Copy-Item $nsis.FullName -Destination "artifacts/"
          }

          $msi = Get-ChildItem -Path "gui" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*bundle*msi*" } |
                 Select-Object -First 1
          if ($msi) {
            Write-Host "Found MSI installer: $($msi.FullName)"
            Copy-Item $msi.FullName -Destination "artifacts/"
          }

          Write-Host "--- Staged artifacts ---"
          Get-ChildItem artifacts/ | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sni-gui-windows
          path: artifacts/
          if-no-files-found: error
