name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        working-directory: gui
        run: npm install

      - name: Generate default icon (no source needed)
        working-directory: gui
        shell: pwsh
        run: |
          # Default icon: solid #00B4D8 (accent color) with "SNI" text.
          # Uses .NET System.Drawing so no extra tools are required on the runner.
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 1024, 1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.TextRenderingHint = 'AntiAliasGridFit'
          $g.Clear([System.Drawing.Color]::FromArgb(0, 180, 216))
          $font = New-Object System.Drawing.Font('Segoe UI', 400, [System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes]::White
          $fmt = New-Object System.Drawing.StringFormat
          $fmt.Alignment = 'Center'
          $fmt.LineAlignment = 'Center'
          $rect = New-Object System.Drawing.RectangleF 0, 0, 1024, 1024
          $g.DrawString('SNI', $font, $brush, $rect, $fmt)
          $g.Dispose()
          $bmp.Save("$pwd\default-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()

      - name: Build icons into gui/icons/
        working-directory: gui
        run: npx tauri icon default-icon.png -o icons

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: sni-gui-windows
          path: gui/src-tauri/target/release/sni-gui.exe
