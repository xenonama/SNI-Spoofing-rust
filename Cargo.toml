[workspace]
members = ["core", "windivert", "backend", "gui"]
resolver = "2"

# Exact pinned versions per spec. Crates inherit via `workspace = true`.
[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bytes = "1.7"
byteorder = "1.5"
thiserror = "1.0"
rand = "0.8"
md5 = "0.7"
parking_lot = "0.12"
eframe = "0.28"
egui = "0.28"
# Features are set per-crate (backend needs Win32_Security for CreateMutexW).
windows = { version = "0.58" }
